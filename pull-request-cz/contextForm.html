<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>CommitiZen</title>
    <script src="lib/VSS.SDK.js"></script>
    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        body {
            min-width: 0;
            margin: 0;
            overflow: auto;
            background-color: transparent;
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
        }

        .widget-configuration {
            display: flex;
            min-width: 0;
            min-height: 100vh;
            flex-direction: column;
            gap: 10px;
            padding: 14px 16px 16px;
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
        }

        .widget-configuration label {
            display: block;
            margin: 0 0 4px;
            color: var(--text-secondary-color, rgba(var(--palette-neutral-80, 51, 51, 51), 1));
            font-weight: 600;
        }

        .single-line-text-input,
        .multi-line-text-input,
        #type-of-change {
            min-width: 0;
        }

        .widget-configuration input[type=text],
        .widget-configuration textarea,
        #type-of-change .combo,
        #type-of-change .combo input {
            width: 100% !important;
            max-width: 100%;
        }

        .widget-configuration input[type=text],
        .widget-configuration textarea {
            border-color: var(--border-color, rgba(var(--palette-neutral-20, 200, 200, 200), 1));
            background-color: var(--background-color, rgba(var(--palette-neutral-0, 255, 255, 255), 1));
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
        }

        .widget-configuration input[type=text]::placeholder,
        .widget-configuration textarea::placeholder {
            color: var(--text-disabled-color, rgba(var(--palette-neutral-60, 102, 102, 102), 1));
            opacity: 1;
        }

        .widget-configuration textarea {
            min-height: 96px;
            resize: vertical;
        }

        .validation-error {
            min-height: 20px;
        }

        fieldset.checkbox {
            min-width: 0;
            margin: 0;
            padding: 2px 0 0;
            border: 0;
        }

        fieldset.checkbox input[type=checkbox] {
            width: 18px;
            height: 18px;
            margin: 0 8px 8px 0;
            accent-color: rgb(0, 120, 212);
            vertical-align: top;
        }

        fieldset.checkbox label {
            display: inline-block;
            max-width: calc(100% - 32px);
            margin: 0 0 8px;
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
            font-weight: 400;
            line-height: 20px;
            vertical-align: top;
        }

        .ui-dialog-buttonpane {
            margin-top: auto;
            padding-top: 4px;
        }

        .ui-dialog-buttonset {
            display: flex;
            width: 100%;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 8px;
        }

        .ui-dialog-buttonset button {
            margin: 0;
        }

        .ui-dialog-buttonset button:hover,
        .ui-dialog-buttonset button:focus {
            border-color: rgba(var(--palette-neutral-100, 0, 0, 0), .35);
            background-color: rgba(var(--palette-neutral-100, 0, 0, 0), .08);
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
        }

        .ui-dialog-buttonset button:active {
            background-color: rgba(var(--palette-neutral-100, 0, 0, 0), .14);
        }

        .ui-dialog-buttonset button.cta:hover,
        .ui-dialog-buttonset button.cta:focus {
            border-color: rgb(0, 90, 158);
            background-color: rgb(0, 90, 158);
            color: rgb(255, 255, 255);
        }

        .ui-dialog-buttonset button.cta:active {
            border-color: rgb(0, 69, 120);
            background-color: rgb(0, 69, 120);
        }

        @media (max-width: 420px) {
            .widget-configuration {
                gap: 8px;
                padding: 10px 12px 12px;
            }

            .widget-configuration textarea {
                min-height: 84px;
            }

            .ui-dialog-buttonset {
                justify-content: stretch;
            }

            .ui-dialog-buttonset button {
                flex: 1 1 100%;
            }
        }
    </style>
</head>

<body>
    <div class="widget-configuration">
        <span class="validation-error">
            <span class="icon-error-exclamation"></span>
            <span id="error" class="validation-error-text"></span>
        </span>
        <div id="type-of-change"></div>
        <div class="single-line-text-input">
            <label for="scope">Scope:</label>
            <input id="scope" type="text" name="scope" placeholder="Denote the SCOPE of this change (optional)" />
        </div>
        <div class="single-line-text-input">
            <label for="subject">Subject:</label>
            <input id="subject" type="text" name="subject"
                placeholder="Write a SHORT, IMPERATIVE tense description of the change" maxlength="50" />
        </div>
        <div class="multi-line-text-input">
            <label for="msgbody">Body:</label>
            <textarea id="msgbody" name="msgbody"
                placeholder='Provide a LONGER description of the change (optional)'></textarea>
        </div>
        <div class="single-line-text-input">
            <label for="breaking-changes">Breaking changes:</label>
            <input id="breaking-changes" type="text" name="breaking-changes"
                placeholder="List any BREAKING CHANGES (optional)" />
        </div>
        <div class="single-line-text-input">
            <label for="closes">Closes:</label>
            <input id="closes" type="text" name="closes"
                placeholder="List any ISSUES CLOSED by this change (optional). E.g.: #31, #34" />
        </div>
        <fieldset class="checkbox">
            <input type="checkbox" id="complete-workitems" name="check" checked="true" />
            <label for="complete-workitems">Complete linked work items after merging</label><br />
            <input type="checkbox" id="delete-source-branch" name="check" checked="true" />
            <label id="delete-source-branch-label" for="delete-source-branch"></label><br />
            <input type="checkbox" id="squash" name="check" />
            <label for="squash">Squash changes when merging</label><br />
            <input type="checkbox" id="update-pr" name="check" checked="true" />
            <label for="update-pr">Update PR title and description with commit message</label><br />
        </fieldset>
        <div class="ui-dialog-buttonpane ui-helper-clearfix bowtie">
            <div class="ui-dialog-buttonset">
                <button id="auto-complete" type="button" class="cta ui-button ui-widget ui-state-default ui-corner-all">
                    <i class="ms-Button-icon bowtie-icon bowtie-trigger-auto icon-36"></i>
                    Set auto-complete
                </button>
                <button id="complete" type="button" class="cta ui-button ui-widget ui-state-default ui-corner-all">
                    <i class="ms-Button-icon bowtie-icon bowtie-tfvc-merge icon-36"></i>
                    Complete
                </button>
                <button id="cancel" type="button" class="ui-button ui-widget ui-state-default ui-corner-all">
                    Cancel
                </button>
            </div>
        </div>
    </div>
    <script src="scripts/context.js"></script>
</body>

</html>
