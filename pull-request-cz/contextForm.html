<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>CommitiZen</title>
    <script src="lib/VSS.SDK.js"></script>
    <style>
        /* ADO's own stylesheet loads after this one and wins ties, so anything the
           form owns is prefixed cz- and layout-critical rules use !important.
           Don't use vh for height here — it feeds the host's sizing and breaks scroll. */
        :root {
            --cz-max-width: 640px;
            --cz-control-height: 32px;
            --cz-gap: 16px;
            --cz-accent: rgb(0, 120, 212);
            --cz-accent-hover: rgb(0, 90, 158);
            --cz-accent-active: rgb(0, 69, 120);
            --cz-error: rgb(205, 74, 69);
            --cz-text: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
            --cz-text-muted: var(--text-secondary-color, rgba(var(--palette-neutral-80, 51, 51, 51), 1));
            --cz-border: var(--border-color, rgba(var(--palette-neutral-20, 200, 200, 200), 1));
            --cz-surface: var(--background-color, rgba(var(--palette-neutral-0, 255, 255, 255), 1));
        }

        html {
            box-sizing: border-box;
            height: 100%;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        /* The host owns the frame height; the form owns the one scrollbar inside it. */
        body {
            height: 100% !important;
            margin: 0;
            overflow: hidden !important;
            background-color: transparent;
            color: var(--cz-text);
            font-size: 14px;
        }

        .cz-form {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: var(--cz-max-width);
            margin: 0 auto;
            color: var(--cz-text);
        }

        /* The scrollable region. The button bar is a flex sibling below it, so it
           always sits at the bottom instead of floating above empty space. */
        .cz-fields {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 16px 0 0;
        }

        .cz-error {
            display: none !important;
            margin: 0 0 var(--cz-gap) !important;
            color: var(--cz-error) !important;
            font-size: 12px;
            line-height: 16px;
        }

        .cz-error.is-visible {
            display: block !important;
        }

        .cz-field {
            margin: 0 0 var(--cz-gap) !important;
            padding: 0 !important;
        }

        .cz-form label {
            display: block !important;
            margin: 0 0 4px !important;
            padding: 0 !important;
            color: var(--cz-text-muted) !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            line-height: 16px !important;
        }

        .cz-form input[type=text],
        .cz-form textarea {
            width: 100% !important;
            padding: 6px 8px !important;
            border: 1px solid var(--cz-border) !important;
            border-radius: 2px !important;
            background-color: var(--cz-surface) !important;
            color: var(--cz-text) !important;
            font-family: inherit !important;
            font-size: 14px !important;
            line-height: 18px !important;
        }

        .cz-form input[type=text] {
            height: var(--cz-control-height) !important;
        }

        /* Real markup: .combo > .wrap > input, plus a .drop chevron. Pinned to the
           shared control height so it lines up with the text inputs. */
        #type-of-change .combo {
            width: 100% !important;
            height: var(--cz-control-height) !important;
        }

        #type-of-change .combo .wrap,
        #type-of-change .combo .drop {
            height: 100% !important;
        }

        #type-of-change .combo .drop {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        #type-of-change .combo input {
            width: 100% !important;
            height: 100% !important;
            padding: 0 8px !important;
            border: 0 !important;
        }

        .cz-form input[type=text]:focus,
        .cz-form textarea:focus {
            border-color: var(--cz-accent) !important;
            outline: none;
        }

        .cz-form input[type=text]::placeholder,
        .cz-form textarea::placeholder {
            color: var(--text-disabled-color, rgba(var(--palette-neutral-60, 102, 102, 102), 1));
            opacity: 1;
        }

        /* No !important on height — it would break the drag-resize grip. */
        .cz-form textarea {
            height: 120px;
            min-height: 80px;
            max-height: 320px;
            resize: vertical;
        }

        .cz-checks {
            margin: 0 0 var(--cz-gap) !important;
            padding: 0 !important;
            border: 0 !important;
        }

        .cz-check {
            display: grid !important;
            grid-template-columns: 16px 1fr;
            column-gap: 8px;
            align-items: start;
            margin-bottom: 10px;
        }

        .cz-check:last-child {
            margin-bottom: 0;
        }

        /* Centres the box on the first line of a label that may wrap. */
        .cz-check input[type=checkbox] {
            width: 16px !important;
            height: 16px !important;
            margin: 2px 0 0 !important;
            padding: 0 !important;
            accent-color: var(--cz-accent);
        }

        .cz-check label {
            margin: 0 !important;
            color: var(--cz-text) !important;
            font-size: 14px !important;
            font-weight: 400 !important;
            line-height: 20px !important;
            cursor: pointer;
        }

        /* A flex footer, not a sticky one — always at the true bottom of the frame. */
        .cz-actions {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 0;
            border-top: 1px solid var(--cz-border);
            background-color: var(--cz-surface);
        }

        .cz-version {
            flex: 1 1 auto;
            min-width: 0;
            margin-right: auto;
            overflow: hidden;
            color: var(--cz-text-muted);
            font-size: 10px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* Buttons don't shrink or wrap; the version label shrinks instead. */
        .cz-actions button {
            flex: 0 0 auto;
            min-width: max-content;
            height: var(--cz-control-height) !important;
            margin: 0 !important;
            padding: 0 14px !important;
            white-space: nowrap;
        }

        .cz-actions button:hover,
        .cz-actions button:focus {
            border-color: rgba(var(--palette-neutral-100, 0, 0, 0), .35);
            background-color: rgba(var(--palette-neutral-100, 0, 0, 0), .08);
            color: var(--cz-text);
        }

        .cz-actions button:active {
            background-color: rgba(var(--palette-neutral-100, 0, 0, 0), .14);
        }

        .cz-actions button.cta:hover,
        .cz-actions button.cta:focus {
            border-color: var(--cz-accent-hover);
            background-color: var(--cz-accent-hover);
            color: rgb(255, 255, 255);
        }

        .cz-actions button.cta:active {
            border-color: var(--cz-accent-active);
            background-color: var(--cz-accent-active);
        }
    </style>
</head>

<body>
    <div class="cz-form">
        <div class="cz-fields">
            <div id="error" class="cz-error" role="alert"></div>
            <div id="type-of-change" class="cz-field"></div>
            <div class="cz-field">
                <label for="scope">Scope:</label>
                <input id="scope" type="text" name="scope" placeholder="Denote the SCOPE of this change (optional)" />
            </div>
            <div class="cz-field">
                <label for="subject">Subject:</label>
                <input id="subject" type="text" name="subject"
                    placeholder="Write a SHORT, IMPERATIVE tense description of the change" maxlength="50" />
            </div>
            <div class="cz-field">
                <label for="msgbody">Body:</label>
                <textarea id="msgbody" name="msgbody"
                    placeholder='Provide a LONGER description of the change (optional)'></textarea>
            </div>
            <div class="cz-field">
                <label for="breaking-changes">Breaking changes:</label>
                <input id="breaking-changes" type="text" name="breaking-changes"
                    placeholder="List any BREAKING CHANGES (optional)" />
            </div>
            <div class="cz-field">
                <label for="closes">Closes:</label>
                <input id="closes" type="text" name="closes"
                    placeholder="List any ISSUES CLOSED by this change (optional). E.g.: #31, #34" />
            </div>
            <fieldset class="cz-checks">
                <div class="cz-check">
                    <input type="checkbox" id="complete-workitems" name="check" checked="true" />
                    <label for="complete-workitems">Complete linked work items after merging</label>
                </div>
                <div class="cz-check">
                    <input type="checkbox" id="delete-source-branch" name="check" checked="true" />
                    <label id="delete-source-branch-label" for="delete-source-branch"></label>
                </div>
                <div class="cz-check">
                    <input type="checkbox" id="squash" name="check" />
                    <label for="squash">Squash changes when merging</label>
                </div>
                <div class="cz-check">
                    <input type="checkbox" id="update-pr" name="check" checked="true" />
                    <label for="update-pr">Update PR title and description with commit message</label>
                </div>
            </fieldset>
        </div>
        <div class="cz-actions bowtie">
            <span id="version" class="cz-version"></span>
            <button id="auto-complete" type="button" class="cta ui-button ui-widget ui-state-default ui-corner-all">
                <i class="ms-Button-icon bowtie-icon bowtie-trigger-auto icon-36"></i>
                Set auto-complete
            </button>
            <button id="complete" type="button" class="cta ui-button ui-widget ui-state-default ui-corner-all">
                <i class="ms-Button-icon bowtie-icon bowtie-tfvc-merge icon-36"></i>
                Complete
            </button>
            <button id="cancel" type="button" class="ui-button ui-widget ui-state-default ui-corner-all">
                Cancel
            </button>
        </div>
    </div>
    <script src="scripts/context.js"></script>
</body>

</html>
