<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>CommitiZen</title>
    <script src="lib/VSS.SDK.js"></script>
    <style>
        /* Azure DevOps clamps the dialog to the space it has, so the frame is a max,
           not a promise: a 465x800 request can arrive as 441x642. The form therefore
           caps at its design width and shrinks with the frame, keeping its gutters.
           Never reintroduce a vh-based height here: it feeds the host's content
           sizing, inflates the dialog past the viewport, and makes scrolling impossible. */
        :root {
            --form-max-width: 394px;
            --form-gutter: 16px;
            --control-height: 32px;
            --field-gap: 14px;
            --accent-color: rgb(0, 120, 212);
            --accent-hover-color: rgb(0, 90, 158);
            --accent-active-color: rgb(0, 69, 120);
        }

        /* Scrolling is a hard requirement, so it is pinned here rather than left to the
           document default, which the platform stylesheet could otherwise override.
           The viewport scrolls and the body grows, so content is always reachable. */
        html {
            box-sizing: border-box;
            height: 100%;
            overflow: auto !important;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        body {
            height: auto !important;
            min-height: 100%;
            margin: 0;
            overflow: visible !important;
            background-color: transparent;
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
            font-size: 14px;
        }

        .widget-configuration {
            width: 100%;
            max-width: var(--form-max-width);
            margin: 0 auto;
            padding: 16px var(--form-gutter) 20px;
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
        }

        .widget-configuration > div {
            margin-bottom: var(--field-gap);
        }

        .widget-configuration label {
            display: block;
            margin: 0 0 4px;
            color: var(--text-secondary-color, rgba(var(--palette-neutral-80, 51, 51, 51), 1));
            font-weight: 600;
        }

        .widget-configuration input[type=text],
        .widget-configuration textarea,
        #type-of-change .combo {
            width: 100% !important;
        }

        .widget-configuration input[type=text] {
            height: var(--control-height);
            padding: 0 8px;
        }

        /* Real markup is .combo > .wrap > input plus a .drop chevron, both laid out by the
           platform stylesheet, so only the outer width is pinned here. */
        #type-of-change .combo input {
            width: 100% !important;
        }

        .widget-configuration input[type=text],
        .widget-configuration textarea {
            border: 1px solid var(--border-color, rgba(var(--palette-neutral-20, 200, 200, 200), 1));
            border-radius: 2px;
            background-color: var(--background-color, rgba(var(--palette-neutral-0, 255, 255, 255), 1));
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
            font-family: inherit;
            font-size: inherit;
        }

        /* The combo keeps the platform's own border, so only the text controls get one. */
        .widget-configuration input[type=text]:focus,
        .widget-configuration textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .widget-configuration input[type=text]::placeholder,
        .widget-configuration textarea::placeholder {
            color: var(--text-disabled-color, rgba(var(--palette-neutral-60, 102, 102, 102), 1));
            opacity: 1;
        }

        /* No !important here: it would override the inline height the browser writes
           while dragging, which silently breaks the resize grip. */
        .widget-configuration textarea {
            height: 120px;
            min-height: 80px;
            max-height: 320px;
            padding: 6px 8px;
            resize: vertical;
        }

        fieldset.checkbox {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0 0 var(--field-gap);
            padding: 2px 0 0;
            border: 0;
        }

        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .checkbox-row input[type=checkbox] {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            margin: 1px 0 0;
            accent-color: var(--accent-color);
        }

        .checkbox-row label {
            margin: 0;
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
            font-weight: 400;
            line-height: 20px;
        }

        .ui-dialog-buttonpane {
            margin-bottom: 0;
            padding-top: 4px;
        }

        .ui-dialog-buttonset {
            display: flex;
            width: 100%;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 8px;
        }

        .ui-dialog-buttonset button {
            height: var(--control-height);
            margin: 0;
            padding: 0 14px;
        }

        .ui-dialog-buttonset button:hover,
        .ui-dialog-buttonset button:focus {
            border-color: rgba(var(--palette-neutral-100, 0, 0, 0), .35);
            background-color: rgba(var(--palette-neutral-100, 0, 0, 0), .08);
            color: var(--text-primary-color, rgba(var(--palette-neutral-100, 0, 0, 0), 1));
        }

        .ui-dialog-buttonset button:active {
            background-color: rgba(var(--palette-neutral-100, 0, 0, 0), .14);
        }

        .ui-dialog-buttonset button.cta:hover,
        .ui-dialog-buttonset button.cta:focus {
            border-color: var(--accent-hover-color);
            background-color: var(--accent-hover-color);
            color: rgb(255, 255, 255);
        }

        .ui-dialog-buttonset button.cta:active {
            border-color: var(--accent-active-color);
            background-color: var(--accent-active-color);
        }
    </style>
</head>

<body>
    <div class="widget-configuration">
        <span class="validation-error">
            <span class="icon-error-exclamation"></span>
            <span id="error" class="validation-error-text"></span>
        </span>
        <div id="type-of-change"></div>
        <div class="single-line-text-input">
            <label for="scope">Scope:</label>
            <input id="scope" type="text" name="scope" placeholder="Denote the SCOPE of this change (optional)" />
        </div>
        <div class="single-line-text-input">
            <label for="subject">Subject:</label>
            <input id="subject" type="text" name="subject"
                placeholder="Write a SHORT, IMPERATIVE tense description of the change" maxlength="50" />
        </div>
        <div class="multi-line-text-input">
            <label for="msgbody">Body:</label>
            <textarea id="msgbody" name="msgbody"
                placeholder='Provide a LONGER description of the change (optional)'></textarea>
        </div>
        <div class="single-line-text-input">
            <label for="breaking-changes">Breaking changes:</label>
            <input id="breaking-changes" type="text" name="breaking-changes"
                placeholder="List any BREAKING CHANGES (optional)" />
        </div>
        <div class="single-line-text-input">
            <label for="closes">Closes:</label>
            <input id="closes" type="text" name="closes"
                placeholder="List any ISSUES CLOSED by this change (optional). E.g.: #31, #34" />
        </div>
        <fieldset class="checkbox">
            <div class="checkbox-row">
                <input type="checkbox" id="complete-workitems" name="check" checked="true" />
                <label for="complete-workitems">Complete linked work items after merging</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="delete-source-branch" name="check" checked="true" />
                <label id="delete-source-branch-label" for="delete-source-branch"></label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="squash" name="check" />
                <label for="squash">Squash changes when merging</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="update-pr" name="check" checked="true" />
                <label for="update-pr">Update PR title and description with commit message</label>
            </div>
        </fieldset>
        <div class="ui-dialog-buttonpane ui-helper-clearfix bowtie">
            <div class="ui-dialog-buttonset">
                <button id="auto-complete" type="button" class="cta ui-button ui-widget ui-state-default ui-corner-all">
                    <i class="ms-Button-icon bowtie-icon bowtie-trigger-auto icon-36"></i>
                    Set auto-complete
                </button>
                <button id="complete" type="button" class="cta ui-button ui-widget ui-state-default ui-corner-all">
                    <i class="ms-Button-icon bowtie-icon bowtie-tfvc-merge icon-36"></i>
                    Complete
                </button>
                <button id="cancel" type="button" class="ui-button ui-widget ui-state-default ui-corner-all">
                    Cancel
                </button>
            </div>
        </div>
    </div>
    <script src="scripts/context.js"></script>
</body>

</html>
